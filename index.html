<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encomendas | POC</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#162c3a;font:16px system-ui}header{background:#163342;color:white;padding:24px}main{max-width:900px;margin:auto;padding:20px}section{background:white;border:1px solid #dce4e8;border-radius:12px;padding:20px;margin-bottom:16px}button,input,select{font:inherit;padding:12px;border:1px solid #b9c5ce;border-radius:8px}button{background:#176b61;color:white;cursor:pointer;margin:4px 0}button:disabled{opacity:.5}input,select{width:100%;margin:6px 0 12px}nav{display:flex;gap:8px;flex-wrap:wrap}small{opacity:.75}img{max-width:220px;max-height:180px;object-fit:contain}article{border-top:1px solid #ddd;padding:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}input[type=checkbox]{width:auto}h2{margin-top:0}</style></head><body><header><small>POC LOCAL · SEM BACKEND</small><h1>Encomendas do condomínio</h1><nav><button id="port">Portaria</button><button id="mor">Morador</button><button id="adm">IndexedDB / Auditoria</button></nav></header><main><p id="msg" role="status">Abrindo IndexedDB...</p><div id="view"></div></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js"></script><script>
const $=id=>document.getElementById(id),view=$('view'),msg=t=>$('msg').textContent=t;let db,mode='port';const residents=[{name:'João da Silva',block:'A',unit:'101'},{name:'Maria Santos',block:'B',unit:'204'}], stores=['packages','queue','audit'];const req=indexedDB.open('condominio-poc-v1',1);req.onupgradeneeded=()=>stores.forEach(s=>req.result.createObjectStore(s,{keyPath:'id'}));req.onerror=()=>msg('Falha ao abrir IndexedDB');req.onsuccess=()=>{db=req.result;msg('IndexedDB disponível');render()};function all(s){return new Promise((resolve,reject)=>{let r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function write(s,fn){return new Promise((resolve,reject)=>{let t=db.transaction(s,'readwrite');t.oncomplete=resolve;t.onabort=()=>reject(t.error);t.onerror=()=>reject(t.error);try{fn(t)}catch(e){t.abort();reject(e)}})}const now=()=>new Date().toISOString(),uid=()=>crypto.randomUUID(),fmt=s=>s?new Date(s).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):'—',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),file=id=>$(id).files[0];function photo(b,e){if(b&&e){let u=URL.createObjectURL(b);e.onload=()=>URL.revokeObjectURL(u);e.src=u}}function bind(el,fn){el.onclick=async()=>{el.disabled=true;try{await fn()}catch(e){msg('Erro: '+e.message)}finally{el.disabled=false}}}for(const id of ['port','mor','adm'])$(id).onclick=()=>{mode=id;render().catch(e=>msg(e.message))};async function render(){if(!db)return;let ps=await all('packages'),qs=await all('queue');if(mode==='port'){view.innerHTML='<section><h2>Receber encomenda</h2><label>Foto da etiqueta<input id="inphoto" type="file" accept="image/*" capture="environment"></label><img id="preview"><br><button id="ocr">Ler etiqueta (OCR real)</button><pre id="raw"></pre><label>Destinatário<input id="name"></label><label>Bloco<input id="block"></label><label>Apartamento<input id="unit"></label><label>Rastreio<input id="tracking"></label><label>Prazo (dias)<input id="days" type="number" min="1" max="30" value="2"></label><select id="kind"><option value="calendar">Dias corridos</option><option value="business">Dias úteis (sem feriados)</option></select><button id="save">Confirmar entrada</button></section><section><h2>Catalogadas</h2>'+ (ps.map(p=>'<article><b>'+esc(p.name)+'</b> · '+esc(p.location)+' · '+esc(p.status)+'<br>Prazo: '+fmt(p.deadline)+(p.status==='aguardando'&&Date.parse(p.deadline)<=Date.now()?'<br><button data-move="'+p.id+'">Confirmar transferência para área geral</button>':'')+'</article>').join('')||'Nenhuma encomenda')+'</section>';$('inphoto').onchange=()=>{photo(file('inphoto'),$('preview'));$('raw').textContent=''};bind($('ocr'),async()=>{let f=file('inphoto');if(!f)return msg('Selecione uma foto');if(!window.Tesseract)return msg('Biblioteca OCR indisponível');let w;try{msg('Carregando OCR...');w=await Tesseract.createWorker('por+eng',1,{logger:m=>{if(m.status==='recognizing text')msg('OCR: '+Math.round(m.progress*100)+'%')}});let {data:{text,confidence}}=await w.recognize(f);if(mode!=='port'||!$('raw'))return;$('raw').textContent=text;let norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let r=residents.find(r=>norm(text).includes(norm(r.name)));$('name').value=r?.name||text.match(/(?:destinat[aá]rio|nome)\s*[:\-]\s*([^\n]+)/i)?.[1]||'';$('block').value=text.match(/(?:bloco|\bbl)\s*[:.\-]?\s*([a-z0-9]+)/i)?.[1]||r?.block||'';$('unit').value=text.match(/(?:apartamento|apto|\bap)\s*[:.\-]?\s*(\d+)/i)?.[1]||r?.unit||'';$('tracking').value=text.match(/\b[A-Z]{2}\d{9}[A-Z]{2}\b/)?.[0]||'';msg('OCR concluído. Confiança: '+Math.round(confidence)+'%. Confira os campos.')}finally{if(w)await w.terminate()}});bind($('save'),async()=>{let f=file('inphoto'),name=$('name').value.trim(),block=$('block').value.trim().toUpperCase(),unit=$('unit').value.trim(),n=Number($('days').value);if(!f||!name||!block||!unit||!Number.isInteger(n)||n<1||n>30)return msg('Foto, destinatário, bloco, unidade e prazo válido são obrigatórios');let d=new Date();while(n){d.setUTCDate(d.getUTCDate()+1);if($('kind').value==='calendar'||![0,6].includes(new Date(d.toLocaleDateString('en-US',{timeZone:'America/Sao_Paulo'})).getDay()))n--}let p={id:uid(),name,block,unit,tracking:$('tracking').value,photo:f,location:'Setor '+block,status:'aguardando',capturedAt:now(),deadline:d.toISOString()};await write(['packages','audit'],t=>{t.objectStore('packages').add(p);t.objectStore('audit').add({id:uid(),packageId:p.id,event:'Entrada',localAt:now()})});msg('Guarde a encomenda no '+p.location);await render()});view.querySelectorAll('[data-move]').forEach(b=>bind(b,async()=>{let p=ps.find(p=>p.id===b.dataset.move);p.location='Área geral';p.status='transferida';await write(['packages','audit'],t=>{t.objectStore('packages').put(p);t.objectStore('audit').add({id:uid(),packageId:p.id,event:'Transferência',localAt:now()})});await render()}))}else if(mode==='mor'){view.innerHTML='<section><h2>Minhas encomendas</h2><label>Perfil demonstrativo<select id="resident"></select></label><div id="items"></div></section><section><h2>Fila local</h2><p>'+qs.length+' pendente(s)</p><button id="sync">Simular confirmação</button><p>Sem servidor: confirmação apenas local.</p></section>';let keys=[...new Set(ps.map(p=>JSON.stringify([p.name,p.block,p.unit])))];keys.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=JSON.parse(k).join(' · ');$('resident').append(o)});function draw(){let selected=ps.filter(p=>JSON.stringify([p.name,p.block,p.unit])===$('resident').value);$('items').innerHTML=selected.map(p=>'<article><b>'+esc(p.location)+'</b> · '+esc(p.status)+'<br>Prazo: '+fmt(p.deadline)+'<br><img id="img-'+p.id+'">'+(['aguardando','transferida'].includes(p.status)?'<label>Foto da retirada<input id="out-'+p.id+'" type="file" accept="image/*" capture="environment"></label><label><input type="checkbox" id="ok-'+p.id+'"> Confirmo que retirei minha encomenda</label><br><button data-take="'+p.id+'">Registrar retirada</button>':'')+'</article>').join('')||'Nenhuma encomenda';selected.forEach(p=>photo(p.photo,$('img-'+p.id)));view.querySelectorAll('[data-take]').forEach(b=>bind(b,async()=>{let p=ps.find(p=>p.id===b.dataset.take),f=file('out-'+p.id);if(!f||!$('ok-'+p.id).checked)return msg('Foto e confirmação obrigatórias');let q={id:p.id,packageId:p.id,photo:f,capturedAt:now(),connectionMode:navigator.onLine?'online':'offline',attempts:0};p.status='pendente';await write(['packages','queue','audit'],t=>{t.objectStore('queue').add(q);t.objectStore('packages').put(p);t.objectStore('audit').add({id:uid(),packageId:p.id,event:'Retirada local',localAt:q.capturedAt})});msg('Retirada na fila persistente');await render()}))}$('resident').onchange=draw;draw();bind($('sync'),async()=>{for(const q of qs){let p=ps.find(p=>p.id===q.packageId);if(!p)continue;p.status='retirada (simulada)';p.withdrawalPhoto=q.photo;p.capturedWithdrawalAt=q.capturedAt;await write(stores,t=>{t.objectStore('packages').put(p);t.objectStore('queue').delete(q.id);t.objectStore('audit').add({id:uid(),packageId:p.id,event:'Confirmação SIMULADA',localAt:now(),capturedAt:q.capturedAt,receivedAt:null,persistedAt:null})})}msg('Simulação local concluída');await render()})}else{view.innerHTML='<section><h2>Diagnóstico IndexedDB</h2><p>Horários do dispositivo, não verificados. Sem autenticação real.</p><div id="data"></div></section>';for(const s of stores){let rows=await all(s),box=document.createElement('article'),h=document.createElement('h3');h.textContent=s+' ('+rows.length+')';box.append(h);for(const r of rows){let pre=document.createElement('pre');pre.textContent=JSON.stringify(r,(k,v)=>v instanceof Blob?{type:v.type,size:v.size}:v,2);box.append(pre);for(const b of [r.photo,r.withdrawalPhoto])if(b instanceof Blob){let i=document.createElement('img');box.append(i);photo(b,i)}}$('data').append(box)}}}
</script></body></html>
