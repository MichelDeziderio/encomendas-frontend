<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encomendas | POC</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#162c3a;font:16px system-ui}header{background:#163342;color:white;padding:24px}main{max-width:900px;margin:auto;padding:20px}section{background:white;border:1px solid #dce4e8;border-radius:12px;padding:20px;margin-bottom:16px}button,input,select{font:inherit;padding:12px;border:1px solid #b9c5ce;border-radius:8px}button{background:#176b61;color:white;cursor:pointer;margin:4px 0}button:disabled{opacity:.5}input,select{width:100%;margin:6px 0 12px}nav{display:flex;gap:8px;flex-wrap:wrap}small{opacity:.75}img{max-width:220px;max-height:180px;object-fit:contain}article{border-top:1px solid #ddd;padding:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}input[type=checkbox]{width:auto}h2{margin-top:0}[hidden]{display:none!important}.steps{display:flex;list-style:none;padding:0;gap:6px;margin:0 0 20px}.steps li{flex:1;text-align:center;border-bottom:3px solid #dce4e8;padding:10px 2px;font-size:14px;color:#54636c}.steps li.active{border-color:#176b61;color:#176b61;font-weight:700}.steps li.done{border-color:#176b61}#cropcanvas{display:block;max-width:100%;height:auto;touch-action:none;user-select:none;cursor:crosshair}button:focus-visible{outline:3px solid #8ac8ba}</style></head><body><header><small>POC LOCAL · SEM BACKEND</small><h1>Encomendas do condomínio</h1><nav><button id="port">Portaria</button><button id="mor">Morador</button><button id="adm">IndexedDB / Auditoria</button></nav></header><main><p id="msg" role="status">Abrindo IndexedDB...</p><div id="view"></div></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js"></script><script>
const $=id=>document.getElementById(id),view=$('view'),msg=t=>$('msg').textContent=t;let db,mode='port';const residents=[{name:'João da Silva',block:'A',unit:'101'},{name:'Maria Santos',block:'B',unit:'204'}], stores=['packages','queue','audit'];const req=indexedDB.open('condominio-poc-v1',1);req.onupgradeneeded=()=>stores.forEach(s=>req.result.createObjectStore(s,{keyPath:'id'}));req.onerror=()=>msg('Falha ao abrir IndexedDB');req.onsuccess=()=>{db=req.result;msg('IndexedDB disponível');render()};function all(s){return new Promise((resolve,reject)=>{let r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function write(s,fn){return new Promise((resolve,reject)=>{let t=db.transaction(s,'readwrite');t.oncomplete=resolve;t.onabort=()=>reject(t.error);t.onerror=()=>reject(t.error);try{fn(t)}catch(e){t.abort();reject(e)}})}const now=()=>new Date().toISOString(),uid=()=>crypto.randomUUID(),fmt=s=>s?new Date(s).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):'—',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),file=id=>$(id).files[0]||$(id+"-gallery")?.files[0];function photo(b,e){if(b&&e){let u=URL.createObjectURL(b);e.onload=()=>URL.revokeObjectURL(u);e.src=u}}function bind(el,fn){el.onclick=async()=>{el.disabled=true;try{await fn()}catch(e){msg('Erro: '+e.message)}finally{el.disabled=false}}}for(const id of ['port','mor','adm'])$(id).onclick=()=>{mode=id;render().catch(e=>msg(e.message))};async function render(){if(!db)return;let ps=await all('packages'),qs=await all('queue');if(mode==='port'){view.innerHTML='<section><h2>Receber encomenda</h2><ol id="steps" class="steps"><li>1. Pacote</li><li>2. Destinatário</li><li>3. Conferência</li></ol><div id="step1"><h3>Foto do pacote inteiro</h3><label>Câmera<input id="packagephoto" type="file" accept="image/*" capture="environment"></label><label>Galeria<input id="packagephoto-gallery" type="file" accept="image/*"></label><img id="packagepreview"><br><button id="next1">Continuar</button></div><div id="step2" hidden><h3>Foto aproximada do destinatário</h3><label>Câmera<input id="inphoto" type="file" accept="image/*" capture="environment"></label><label>Galeria<input id="inphoto-gallery" type="file" accept="image/*"></label><p>Arraste o dedo sobre a imagem para selecionar nome e endereço do destinatário.</p><canvas id="cropcanvas" hidden></canvas><p id="cropstatus"></p><button id="resetcrop">Limpar seleção</button> <button id="back2">Voltar</button> <button id="ocr">Ler seleção e continuar</button> <button id="manual">Preencher manualmente</button></div><div id="step3" hidden><h3>Confira antes de salvar</h3><button id="back3">Voltar</button><pre id="raw"></pre><label>Destinatário<input id="name"></label><label>Bloco<input id="block"></label><label>Apartamento<input id="unit"></label><label>Rastreio<input id="tracking"></label><label>Prazo (dias)<input id="days" type="number" min="1" max="30" value="2"></label><select id="kind"><option value="calendar">Dias corridos</option><option value="business">Dias úteis (sem feriados)</option></select><button id="save">Confirmar entrada</button></div></section><section><h2>Catalogadas</h2>'+ (ps.map(p=>'<article><b>'+esc(p.name)+'</b> · '+esc(p.location)+' · '+esc(p.status)+'<br>Prazo: '+fmt(p.deadline)+(p.status==='aguardando'&&Date.parse(p.deadline)<=Date.now()?'<br><button data-move="'+p.id+'">Confirmar transferência para área geral</button>':'')+'</article>').join('')||'Nenhuma encomenda')+'</section>';const canvas=$('cropcanvas'),ctx=canvas.getContext('2d');let source=null,selection=null,anchor=null,cropBlob=null,token=0,busy=false;function showStep(n){for(let i=1;i<=3;i++){ $('step'+i).hidden=i!==n;const li=$('steps').children[i-1];li.className=i===n?'active':i<n?'done':'';if(i===n)li.setAttribute('aria-current','step');else li.removeAttribute('aria-current')}}showStep(1);function clearFields(){for(const id of ['name','block','unit','tracking'])$(id).value='';$('raw').textContent=''}function draw(){if(!source)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(source,0,0,canvas.width,canvas.height);if(selection){const q=selection;ctx.strokeStyle='#00a67e';ctx.lineWidth=3;ctx.strokeRect(q.x,q.y,q.w,q.h);ctx.fillStyle='rgba(0,166,126,.12)';ctx.fillRect(q.x,q.y,q.w,q.h)}$('cropstatus').textContent=selection?'Região selecionada':'Marque a região do destinatário'}function point(e){const q=canvas.getBoundingClientRect();return {x:Math.max(0,Math.min(canvas.width,(e.clientX-q.left)*canvas.width/q.width)),y:Math.max(0,Math.min(canvas.height,(e.clientY-q.top)*canvas.height/q.height))}}canvas.onpointerdown=e=>{if(!source||busy)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);anchor=point(e);selection=null;cropBlob=null;clearFields();draw()};canvas.onpointermove=e=>{if(!anchor)return;const p=point(e);selection={x:Math.min(p.x,anchor.x),y:Math.min(p.y,anchor.y),w:Math.abs(p.x-anchor.x),h:Math.abs(p.y-anchor.y)};draw()};canvas.onpointerup=e=>{if(!anchor)return;canvas.onpointermove(e);anchor=null;if(selection&&(selection.w<8||selection.h<8))selection=null;draw()};canvas.onpointercancel=()=>{anchor=null;selection=null;draw()};$('resetcrop').onclick=()=>{if(!busy){selection=null;cropBlob=null;clearFields();draw()}};for(const id of ['packagephoto','packagephoto-gallery'])$(id).onchange=()=>{if(!$(id).files.length)return;$(id==='packagephoto'?'packagephoto-gallery':'packagephoto').value='';photo(file('packagephoto'),$('packagepreview'))};$('next1').onclick=()=>{if(!file('packagephoto'))return msg('Selecione a foto do pacote');showStep(2)};for(const id of ['inphoto','inphoto-gallery'])$(id).onchange=async()=>{if(!$(id).files.length)return;$(id==='inphoto'?'inphoto-gallery':'inphoto').value='';const current=++token;source=null;selection=null;cropBlob=null;clearFields();canvas.hidden=true;const url=URL.createObjectURL(file('inphoto'));try{const im=new Image();im.src=url;await im.decode();if(current!==token||!canvas.isConnected)return;source=im;const scale=Math.min(1,1000/Math.max(im.naturalWidth,im.naturalHeight));canvas.width=Math.max(1,Math.round(im.naturalWidth*scale));canvas.height=Math.max(1,Math.round(im.naturalHeight*scale));canvas.hidden=false;draw()}catch(e){msg('Falha ao abrir imagem: '+e.message)}finally{URL.revokeObjectURL(url)}};$('back2').onclick=()=>{if(!busy)showStep(1)};$('back3').onclick=()=>showStep(2);$('manual').onclick=()=>{if(!busy&&source)showStep(3);else if(!busy)msg('Selecione a foto do destinatário')};bind($('ocr'),async()=>{if(!source||!selection)return msg('Marque a região do destinatário');if(!window.Tesseract)return msg('OCR indisponível');busy=true;const controls=['inphoto','inphoto-gallery','back2','manual','resetcrop'];for(const id of controls)$(id).disabled=true;let w;const started=performance.now();try{const q=selection,sx=source.naturalWidth/canvas.width,sy=source.naturalHeight/canvas.height,c=document.createElement('canvas'),scale=Math.min(1,2200/Math.max(q.w*sx,q.h*sy));c.width=Math.max(1,Math.round(q.w*sx*scale));c.height=Math.max(1,Math.round(q.h*sy*scale));c.getContext('2d').drawImage(source,q.x*sx,q.y*sy,q.w*sx,q.h*sy,0,0,c.width,c.height);cropBlob=await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error('Falha no recorte')),'image/png'));msg('Carregando OCR...');w=await Tesseract.createWorker('por',1,{logger:m=>{if(m.status==='recognizing text'&&canvas.isConnected)msg('OCR: '+Math.round(m.progress*100)+'%')}});await w.setParameters({tessedit_pageseg_mode:'6'});let {data:{text,confidence}}=await w.recognize(cropBlob);if(!canvas.isConnected)return;$('raw').textContent=text;let norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let r=residents.find(r=>norm(text).includes(norm(r.name)));$('name').value=r?.name||text.match(/(?:destinat[aá]rio|nome)\s*[:\-]?\s*([^\n]+)/i)?.[1]||'';$('block').value=text.match(/(?:bloco|\bbl)\s*[:.\-]?\s*([a-z0-9]+)/i)?.[1]||r?.block||'';$('unit').value=text.match(/(?:apartamento|apto|\bap)\s*[:.\-]?\s*(\d+)/i)?.[1]||r?.unit||'';$('tracking').value=text.match(/\b[A-Z]{2}\d{9}[A-Z]{2}\b/)?.[0]||'';showStep(3);msg('OCR concluído em '+((performance.now()-started)/1000).toFixed(1)+' s. Confiança: '+Math.round(confidence)+'%. Confira os campos.')}finally{busy=false;if(canvas.isConnected)for(const id of controls)$(id).disabled=false;if(w)await w.terminate()}});bind($('save'),async()=>{let f=file('packagephoto'),labelPhoto=file('inphoto'),name=$('name').value.trim(),block=$('block').value.trim().toUpperCase(),unit=$('unit').value.trim(),n=Number($('days').value);if(!f||!labelPhoto||!name||!block||!unit||!Number.isInteger(n)||n<1||n>30)return msg('As duas fotos, destinatário, bloco, unidade e prazo válido são obrigatórios');let d=new Date();while(n){d.setUTCDate(d.getUTCDate()+1);if($('kind').value==='calendar'||![0,6].includes(new Date(d.toLocaleDateString('en-US',{timeZone:'America/Sao_Paulo'})).getDay()))n--}let p={id:uid(),name,block,unit,tracking:$('tracking').value,photo:f,labelPhoto,recipientCrop:cropBlob,location:'Setor '+block,status:'aguardando',capturedAt:now(),deadline:d.toISOString()};await write(['packages','audit'],t=>{t.objectStore('packages').add(p);t.objectStore('audit').add({id:uid(),packageId:p.id,event:'Entrada',localAt:now()})});msg('Guarde a encomenda no '+p.location);await render()});view.querySelectorAll('[data-move]').forEach(b=>bind(b,async()=>{let p=ps.find(p=>p.id===b.dataset.move);p.location='Área geral';p.status='transferida';await write(['packages','audit'],t=>{t.objectStore('packages').put(p);t.objectStore('audit').add({id:uid(),packageId:p.id,event:'Transferência',localAt:now()})});await render()}))}else if(mode==='mor'){view.innerHTML='<section><h2>Minhas encomendas</h2><label>Perfil demonstrativo<select id="resident"></select></label><div id="items"></div></section><section><h2>Fila local</h2><p>'+qs.length+' pendente(s)</p><button id="sync">Simular confirmação</button><p>Sem servidor: confirmação apenas local.</p></section>';let keys=[...new Set(ps.map(p=>JSON.stringify([p.name,p.block,p.unit])))];keys.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=JSON.parse(k).join(' · ');$('resident').append(o)});function draw(){let selected=ps.filter(p=>JSON.stringify([p.name,p.block,p.unit])===$('resident').value);$('items').innerHTML=selected.map(p=>'<article><b>'+esc(p.location)+'</b> · '+esc(p.status)+'<br>Prazo: '+fmt(p.deadline)+'<br><img id="img-'+p.id+'">'+(['aguardando','transferida'].includes(p.status)?'<label>Tirar foto da retirada<input id="out-'+p.id+'" type="file" accept="image/*" capture="environment"></label><label>Escolher foto da galeria (teste)<input id="out-'+p.id+'-gallery" type="file" accept="image/*"></label><label><input type="checkbox" id="ok-'+p.id+'"> Confirmo que retirei minha encomenda</label><br><button data-take="'+p.id+'">Registrar retirada</button>':'')+'</article>').join('')||'Nenhuma encomenda';selected.forEach(p=>{photo(p.photo,$('img-'+p.id));const a=$('out-'+p.id),b=$('out-'+p.id+'-gallery');if(a&&b){a.onchange=()=>{if(a.files.length)b.value=''};b.onchange=()=>{if(b.files.length)a.value=''}}});view.querySelectorAll('[data-take]').forEach(b=>bind(b,async()=>{let p=ps.find(p=>p.id===b.dataset.take),f=file('out-'+p.id);if(!f||!$('ok-'+p.id).checked)return msg('Foto e confirmação obrigatórias');let q={id:p.id,packageId:p.id,photo:f,capturedAt:now(),connectionMode:navigator.onLine?'online':'offline',attempts:0};p.status='pendente';await write(['packages','queue','audit'],t=>{t.objectStore('queue').add(q);t.objectStore('packages').put(p);t.objectStore('audit').add({id:uid(),packageId:p.id,event:'Retirada local',localAt:q.capturedAt})});msg('Retirada na fila persistente');await render()}))}$('resident').onchange=draw;draw();bind($('sync'),async()=>{for(const q of qs){let p=ps.find(p=>p.id===q.packageId);if(!p)continue;p.status='retirada (simulada)';p.withdrawalPhoto=q.photo;p.capturedWithdrawalAt=q.capturedAt;await write(stores,t=>{t.objectStore('packages').put(p);t.objectStore('queue').delete(q.id);t.objectStore('audit').add({id:uid(),packageId:p.id,event:'Confirmação SIMULADA',localAt:now(),capturedAt:q.capturedAt,receivedAt:null,persistedAt:null})})}msg('Simulação local concluída');await render()})}else{view.innerHTML='<section><h2>Diagnóstico IndexedDB</h2><p>Horários do dispositivo, não verificados. Sem autenticação real.</p><div id="data"></div></section>';for(const s of stores){let rows=await all(s),box=document.createElement('article'),h=document.createElement('h3');h.textContent=s+' ('+rows.length+')';box.append(h);for(const r of rows){let pre=document.createElement('pre');pre.textContent=JSON.stringify(r,(k,v)=>v instanceof Blob?{type:v.type,size:v.size}:v,2);box.append(pre);for(const b of [r.photo,r.labelPhoto,r.recipientCrop,r.withdrawalPhoto])if(b instanceof Blob){let i=document.createElement('img');box.append(i);photo(b,i)}}$('data').append(box)}}}
</script></body></html>
